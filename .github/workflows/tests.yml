name: Local safety checks

# Run manually: private-repository runner usage may be billable.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch pinned upstream dependency
        run: |
          git clone --no-checkout https://github.com/rison1337/Alisa-ChatGPT-voice-assistant.git ../alisa-voice
          git -C ../alisa-voice checkout --detach 6ba87295b96bb533e89a9cbf9515c0322c6ae5c3
      - name: Build station test executable
        working-directory: relay
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 GO111MODULE=off go build -o station-relay .
      - name: Run Python checks
        env:
          STATION_ALISA_REPO: ../alisa-voice
        run: python3 -m unittest -v test_setup_mac test_install_mac test_mac_login test_mac_native_install test_configure_mac test_mode_switch test_pipeline test_speech_segments test_frame_dispatcher test_mode_router test_voice_service test_pcm_bridge test_station_transport
      - name: Run relay tests
        working-directory: relay
        run: GO111MODULE=off go test -race ./...
